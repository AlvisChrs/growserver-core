<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none">
  <defs>
    <!-- Top Face: Electric Cyan to Vivid Blue -->
    <linearGradient id="topGrad" x1="40" y1="20" x2="120" y2="65" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Left Face: Deep Sapphire to Navy -->
    <linearGradient id="leftGrad" x1="30" y1="50" x2="80" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Right Face: Modern Indigo Blue -->
    <linearGradient id="rightGrad" x1="130" y1="50" x2="80" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>

    <!-- Wrench Hero: Luminous Warm Gold -->
    <linearGradient id="wrenchGrad" x1="50" y1="110" x2="110" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>

    <!-- Crisp Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2563EB" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ISOMETRIC SERVER CORE BLOCK (Transparent Background) -->
  <g filter="url(#glow)">
    <!-- Top Face -->
    <path d="M 80 18 
             C 83 16, 87 16, 90 18 
             L 134 43 
             C 137 45, 138 48, 136 51 
             L 86 80 
             C 82 82, 78 82, 74 80 
             L 24 51 
             C 22 48, 23 45, 26 43 
             Z" 
          fill="url(#topGrad)"/>

    <!-- Left Face -->
    <path d="M 24 55 
             L 74 84 
             C 78 86, 80 88, 80 91 
             L 80 137 
             C 80 140, 77 142, 74 140 
             L 26 113 
             C 23 111, 21 108, 21 105 
             L 21 59 
             C 21 56, 22 54, 24 55 
             Z" 
          fill="url(#leftGrad)"/>

    <!-- Right Face -->
    <path d="M 136 55 
             L 86 84 
             C 82 86, 80 88, 80 91 
             L 80 137 
             C 80 140, 83 142, 86 140 
             L 134 113 
             C 137 111, 139 108, 139 105 
             L 139 59 
             C 139 56, 138 54, 136 55 
             Z" 
          fill="url(#rightGrad)"/>
  </g>

  <!-- MINIMALIST HERO WRENCH (Floating Angled Golden Wrench) -->
  <g transform="translate(80, 78) rotate(-40) translate(-80, -78)">
    <!-- Shadow Mask / Border for clean separation from cube -->
    <path d="M 73 54 
             L 73 112 
             C 73 116, 76 119, 80 119 
             C 84 119, 87 116, 87 112 
             L 87 54 
             Z" 
          stroke="#0F172A" 
          stroke-width="6" 
          stroke-linejoin="round"/>

    <!-- Wrench Handle -->
    <rect x="74" y="54" width="12" height="58" rx="6" fill="url(#wrenchGrad)"/>
    
    <!-- End Hole -->
    <circle cx="80" cy="104" r="3" fill="#0F172A"/>

    <!-- Wrench Head -->
    <path d="M 68 47 
             C 66 36, 72 26, 80 26 
             C 88 26, 94 36, 92 47 
             L 88 45 
             C 86 40, 83 38, 80 38 
             C 77 38, 74 40, 72 45 
             Z" 
          fill="url(#wrenchGrad)" 
          stroke="#0F172A" 
          stroke-width="2.5" 
          stroke-linejoin="round"/>
  </g>

  <!-- Glowing Core Highlights -->
  <circle cx="80" cy="18" r="2.5" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="135" cy="47" r="2" fill="#38BDF8" opacity="0.8"/>
</svg>
